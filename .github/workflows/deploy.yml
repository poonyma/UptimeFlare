name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # Automatically get an account id via the API Token
      # if secrets.CLOUDFLARE_ACCOUNT_ID is not set.
      - name: Fetch Account ID
        id: fetch_account_id
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            echo "Using provided CLOUDFLARE_ACCOUNT_ID from secrets."
          else
            ACCOUNT_ID=$(curl -fsSL \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts" |
              jq -r '.result[0].id')

            if [[ -z "$ACCOUNT_ID" || "$ACCOUNT_ID" == "null" ]]; then
              echo "Failed to get an account id."
              exit 1
            fi
          fi

          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install packages
        run: |
          npm install
          cd worker
          npm install

      - name: Build worker
        run: |
          cd worker
          npx wrangler deploy src/index.ts --outdir dist --dry-run

      - name: Build page
        run: |
          npx @cloudflare/next-on-pages

      - name: Create D1 database and tables
        run: |
          python3 deploy/init_d1.py

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}

      - name: Migrate state from KV (if needed)
        run: |
          python3 deploy/migrate_kv.py

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      - name: Deploy using Terraform
        run: |
          set -euo pipefail

          terraform init

          ACCOUNT_ID="$TF_VAR_CLOUDFLARE_ACCOUNT_ID"

          echo "=========================================="
          echo "Checking existing UptimeFlare resources"
          echo "=========================================="

          # ---------------------------------------------------------
          # 1. Check Worker
          # ---------------------------------------------------------
          WORKER_RESP=$(curl -fsSL \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/uptimeflare_worker" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" || true)

          WORKER_EXISTS=$(echo "$WORKER_RESP" | jq -r '.success // false')

          if [[ "$WORKER_EXISTS" == "true" ]]; then
            echo "Existing Worker found: uptimeflare_worker"
            WORKER_EXISTS=true
          else
            echo "No existing Worker found: uptimeflare_worker"
            WORKER_EXISTS=false
          fi

          # ---------------------------------------------------------
          # 2. Check Durable Object
          # ---------------------------------------------------------
          DO_RESP=$(curl -fsSL \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/durable_objects/namespaces?per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" || true)

          DO_EXISTS=$(echo "$DO_RESP" |
            jq -e '.result[]? |
              select(.script == "uptimeflare_worker" and .class == "RemoteChecker")' \
            > /dev/null 2>&1 && echo true || echo false)

          # ---------------------------------------------------------
          # 3. Decide whether migration is actually needed
          # ---------------------------------------------------------
          if [[ "$WORKER_EXISTS" == "true" ]]; then

            if [[ "$DO_EXISTS" == "true" ]]; then
              echo "Worker exists and RemoteChecker exists."
              echo "No Durable Object migration needed."
              export TF_VAR_enable_do_migration=false

            else
              echo "Worker exists but RemoteChecker does not exist."
              echo "Existing Worker requires Durable Object migration."
              export TF_VAR_enable_do_migration=true
            fi

          else

            echo "Worker does not exist."
            echo "This is a new Worker deployment."
            echo "Durable Object migration is NOT required."
            export TF_VAR_enable_do_migration=false

          fi

          # ---------------------------------------------------------
          # 4. Import D1
          # ---------------------------------------------------------
          echo "Importing D1 database..."

          terraform import \
            cloudflare_d1_database.uptimeflare_d1 \
            "${ACCOUNT_ID}/${D1_ID}"

          # ---------------------------------------------------------
          # 5. Import Worker only if it exists
          # ---------------------------------------------------------
          if [[ "$WORKER_EXISTS" == "true" ]]; then
            echo "Importing existing Worker..."

            terraform import \
              cloudflare_workers_script.uptimeflare_worker \
              "${ACCOUNT_ID}/uptimeflare_worker"
          else
            echo "Skipping Worker import: Worker does not exist."
          fi

          # ---------------------------------------------------------
          # 6. Import Cron only if Worker exists
          # ---------------------------------------------------------
          if [[ "$WORKER_EXISTS" == "true" ]]; then
            echo "Importing existing Cron trigger..."

            terraform import \
              cloudflare_workers_cron_trigger.uptimeflare_worker_cron \
              "${ACCOUNT_ID}/uptimeflare_worker" || \
              echo "WARNING: Cron trigger import failed, continuing..."
          else
            echo "Skipping Cron import: Worker does not exist."
          fi

          # ---------------------------------------------------------
          # 7. Check and import Pages project
          # ---------------------------------------------------------
          PAGES_RESP=$(curl -fsSL \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/uptimeflare" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" || true)

          PAGES_EXISTS=$(echo "$PAGES_RESP" | jq -r '.success // false')

          if [[ "$PAGES_EXISTS" == "true" ]]; then
            echo "Existing Pages project found: uptimeflare"

            terraform import \
              cloudflare_pages_project.uptimeflare \
              "${ACCOUNT_ID}/uptimeflare"
          else
            echo "No existing Pages project found: uptimeflare"
            echo "Skipping Pages import. Terraform will create it."
          fi

          # ---------------------------------------------------------
          # 8. Terraform plan/apply
          # ---------------------------------------------------------
          echo "=========================================="
          echo "Terraform apply"
          echo "=========================================="

          echo "enable_do_migration=${TF_VAR_enable_do_migration}"

          terraform plan \
            -input=false \
            -out=tfplan

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      # Currently Terraform Cloudflare provider doesn't support direct upload,
      # use wrangler to upload instead.
      - name: Upload pages
        run: |
          npx wrangler pages deploy .vercel/output/static --project-name uptimeflare

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}

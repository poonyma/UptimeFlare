name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      # Automatically get an account id via the API Token
      # if secrets.CLOUDFLARE_ACCOUNT_ID is not set.
      - name: Fetch Account ID
        id: fetch_account_id
        run: |
          set -euo pipefail

          if [[ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            echo "Using provided CLOUDFLARE_ACCOUNT_ID from secrets."
          else
            RESPONSE=$(curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts")

            if ! echo "$RESPONSE" | jq empty >/dev/null 2>&1; then
              echo "ERROR: Cloudflare API returned invalid JSON while fetching Account ID."
              echo "$RESPONSE"
              exit 1
            fi

            ACCOUNT_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')

            if [[ -z "$ACCOUNT_ID" ]]; then
              echo "ERROR: Failed to get Cloudflare Account ID."
              echo "$RESPONSE"
              exit 1
            fi
          fi

          echo "Cloudflare Account ID: $ACCOUNT_ID"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install packages
        run: |
          npm install
          cd worker
          npm install

      - name: Build worker
        run: |
          cd worker
          npx wrangler deploy src/index.ts --outdir dist --dry-run

      - name: Build page
        run: |
          npx @cloudflare/next-on-pages

      - name: Create D1 database and tables
        run: |
          python3 deploy/init_d1.py

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}

      - name: Migrate state from KV (if needed)
        run: |
          python3 deploy/migrate_kv.py

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      - name: Deploy using Terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform init

          ACCOUNT_ID="$TF_VAR_CLOUDFLARE_ACCOUNT_ID"

          echo "=========================================="
          echo "Checking existing UptimeFlare resources"
          echo "=========================================="

          #
          # ---------------------------------------------------------
          # 1. Check Worker
          # ---------------------------------------------------------
          #

          WORKER_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/uptimeflare_worker"

          WORKER_TMP=$(mktemp)

          WORKER_HTTP_CODE=$(curl -sS \
            -o "$WORKER_TMP" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$WORKER_URL" || true)

          echo "Worker API HTTP status: $WORKER_HTTP_CODE"

          if [[ "$WORKER_HTTP_CODE" == "200" ]]; then
            echo "Existing Worker found: uptimeflare_worker"
            WORKER_EXISTS=true

          elif [[ "$WORKER_HTTP_CODE" == "404" ]]; then
            echo "Worker does not exist: uptimeflare_worker"
            WORKER_EXISTS=false

          else
            echo "ERROR: Unexpected Worker API response."
            echo "HTTP status: $WORKER_HTTP_CODE"
            echo "Response:"
            cat "$WORKER_TMP"
            rm -f "$WORKER_TMP"
            exit 1
          fi

          rm -f "$WORKER_TMP"

          #
          # ---------------------------------------------------------
          # 2. Check Durable Object
          # ---------------------------------------------------------
          #

          DO_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/durable_objects/namespaces?per_page=1000"

          DO_TMP=$(mktemp)

          DO_HTTP_CODE=$(curl -sS \
            -o "$DO_TMP" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$DO_URL" || true)

          echo "Durable Object API HTTP status: $DO_HTTP_CODE"

          if [[ "$DO_HTTP_CODE" != "200" ]]; then
            echo "ERROR: Failed to query Durable Object namespaces."
            echo "HTTP status: $DO_HTTP_CODE"
            echo "Response:"
            cat "$DO_TMP"
            rm -f "$DO_TMP"
            exit 1
          fi

          if ! jq empty "$DO_TMP" >/dev/null 2>&1; then
            echo "ERROR: Cloudflare returned invalid JSON for Durable Objects."
            echo "Response:"
            cat "$DO_TMP"
            rm -f "$DO_TMP"
            exit 1
          fi

          if jq -e \
            '.result[]? |
             select(
               .script == "uptimeflare_worker"
               and
               .class == "RemoteChecker"
             )' \
            "$DO_TMP" >/dev/null 2>&1; then

            echo "Existing Durable Object namespace found:"
            echo "  Worker: uptimeflare_worker"
            echo "  Class : RemoteChecker"

            DO_EXISTS=true
          else
            echo "No RemoteChecker Durable Object found."
            DO_EXISTS=false
          fi

          rm -f "$DO_TMP"

          #
          # ---------------------------------------------------------
          # 3. Decide Durable Object migration
          # ---------------------------------------------------------
          #

          if [[ "$WORKER_EXISTS" == "true" ]]; then

            if [[ "$DO_EXISTS" == "true" ]]; then
              echo "Existing Worker + RemoteChecker found."
              echo "No Durable Object migration needed."

              export TF_VAR_enable_do_migration=false

            else
              echo "Existing Worker found, but RemoteChecker is missing."
              echo "Durable Object migration is required."

              export TF_VAR_enable_do_migration=true
            fi

          else

            echo "Worker does not exist."
            echo "This is a new Worker deployment."
            echo "Durable Object migration is NOT required."

            export TF_VAR_enable_do_migration=false
          fi

          echo "TF_VAR_enable_do_migration=${TF_VAR_enable_do_migration}"

          #
          # ---------------------------------------------------------
          # 4. Import D1
          # ---------------------------------------------------------
          #

          echo "=========================================="
          echo "Importing D1"
          echo "=========================================="

          terraform import \
            cloudflare_d1_database.uptimeflare_d1 \
            "${ACCOUNT_ID}/${D1_ID}"

          #
          # ---------------------------------------------------------
          # 5. Import Worker only when it exists
          # ---------------------------------------------------------
          #

          if [[ "$WORKER_EXISTS" == "true" ]]; then

            echo "=========================================="
            echo "Importing existing Worker"
            echo "=========================================="

            terraform import \
              cloudflare_workers_script.uptimeflare_worker \
              "${ACCOUNT_ID}/uptimeflare_worker"

          else

            echo "Worker does not exist."
            echo "Skipping Worker import."
            echo "Terraform will create it."

          fi

          #
          # ---------------------------------------------------------
          # 6. Import Cron only when Worker exists
          # ---------------------------------------------------------
          #

          if [[ "$WORKER_EXISTS" == "true" ]]; then

            echo "=========================================="
            echo "Importing existing Cron trigger"
            echo "=========================================="

            terraform import \
              cloudflare_workers_cron_trigger.uptimeflare_worker_cron \
              "${ACCOUNT_ID}/uptimeflare_worker" || \
              echo "WARNING: Cron trigger import failed, continuing..."

          else

            echo "Worker does not exist."
            echo "Skipping Cron import."
            echo "Terraform will create it."

          fi

          #
          # ---------------------------------------------------------
          # 7. Check Pages project
          # ---------------------------------------------------------
          #

          PAGES_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/uptimeflare"

          PAGES_TMP=$(mktemp)

          PAGES_HTTP_CODE=$(curl -sS \
            -o "$PAGES_TMP" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$PAGES_URL" || true)

          echo "Pages API HTTP status: $PAGES_HTTP_CODE"

          if [[ "$PAGES_HTTP_CODE" == "200" ]]; then

            echo "Existing Pages project found: uptimeflare"

            terraform import \
              cloudflare_pages_project.uptimeflare \
              "${ACCOUNT_ID}/uptimeflare"

          elif [[ "$PAGES_HTTP_CODE" == "404" ]]; then

            echo "Pages project does not exist: uptimeflare"
            echo "Skipping Pages import."
            echo "Terraform will create it."

          else

            echo "ERROR: Unexpected Pages API response."
            echo "HTTP status: $PAGES_HTTP_CODE"
            echo "Response:"
            cat "$PAGES_TMP"

            rm -f "$PAGES_TMP"
            exit 1

          fi

          rm -f "$PAGES_TMP"

          #
          # ---------------------------------------------------------
          # 8. Terraform Plan
          # ---------------------------------------------------------
          #

          echo "=========================================="
          echo "Terraform plan"
          echo "=========================================="

          terraform plan \
            -input=false \
            -out=tfplan

          #
          # ---------------------------------------------------------
          # 9. Terraform Apply
          # ---------------------------------------------------------
          #

          echo "=========================================="
          echo "Terraform apply"
          echo "=========================================="

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      # Currently Terraform Cloudflare provider doesn't support direct upload,
      # use wrangler to upload instead.
      - name: Upload pages
        run: |
          npx wrangler pages deploy .vercel/output/static --project-name uptimeflare

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
